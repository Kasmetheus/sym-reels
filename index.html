<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SYM — launch reels</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: #0c0c0d; color: #ecece8; }
    main { max-width: 42rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    h1 { font-weight: 500; letter-spacing: -0.04em; font-size: 2.25rem; }
    p.lead { color: #8e8e8a; line-height: 1.5; }
    section { margin: 2.5rem 0; }
    h2 { font-weight: 500; font-size: 1.15rem; }
    video { width: 100%; background: #000; border-radius: 12px; }
    a { color: #c5cdc8; }
  </style>
</head>
<body>
  <main>
    <h1>SYM</h1>
    <p class="lead">Three 15-second concept launch spots. Tap play. Type on screens is chewed — judge the stance.</p>
    <section>
      <h2>1 · Household</h2>
      <p class="lead">Watch line. Parking lot. Kitchen. Never opened a chat.</p>
      <video controls playsinline preload="metadata" src="v1-household.mp4"></video>
    </section>
    <section>
      <h2>2 · Partner that acts</h2>
      <p class="lead">Speaks first. Hold send. Then the car.</p>
      <video controls playsinline preload="metadata" src="v2-partner.mp4"></video>
    </section>
    <section>
      <h2>3 · Install</h2>
      <p class="lead">Empty home. Share sheet. Ward. $9.99 once.</p>
      <video controls playsinline preload="metadata" src="v3-install.mp4"></video>
    </section>
  </main>
</body>
</html>
